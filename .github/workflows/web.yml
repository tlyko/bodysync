name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# One run per branch; cancel queued PR runs (apply z main nigdy nie jest tu,
# więc bezpieczne cancel).
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build (vite — sanity check że bundle composes)
        run: npm run build
