name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# One run per branch; cancel queued PR runs (apply z main nigdy nie jest tu,
# więc bezpieczne cancel).
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build (vite — sanity check że bundle composes)
        run: npm run build
