name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'apps/api/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'apps/api/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    # Manual trigger (gh workflow run terraform.yml --ref main).
    # Useful as a no-op smoke test, or when the paths filter would
    # otherwise skip a run we want to force.

# Concurrency: one run at a time per branch. Cancel queued runs on the same
# PR but not on main (apply must finish).
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write       # for AWS OIDC role assumption
  contents: read
  pull-requests: write  # to post the plan as a PR comment

env:
  AWS_REGION: eu-west-1
  TF_INPUT: '0'         # never prompt
  TF_IN_AUTOMATION: '1' # cleaner CLI output

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/handlers/**/requirements.txt

      - name: Install apps/api dev deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: apps/api
        run: pytest -v

      - name: Run ruff
        working-directory: apps/api
        run: |
          ruff check .
          ruff format --check .

      - name: Build Lambda zips
        working-directory: apps/api
        run: python scripts/build.py

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::214598715232:role/syncbody-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Terraform fmt check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -no-color

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: infrastructure/terraform
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'infrastructure/terraform/plan.txt';
            let plan = fs.readFileSync(path, 'utf8');
            // Truncate huge plans so we don't hit GH 65k char comment limit.
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(-MAX);
              plan = '… (plan truncated to last ' + MAX + ' chars) …\n' + plan;
            }
            const body = [
              '## `terraform plan`',
              '',
              'Captured by GitHub Actions for commit `' + context.sha.slice(0, 7) + '`.',
              '',
              '<details><summary>Full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: infrastructure/terraform
        run: terraform apply -no-color -auto-approve tfplan
